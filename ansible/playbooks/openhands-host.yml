---
- name: Prepare OpenHands host directories
  hosts: engos
  become: true

  tasks:
    - name: Criar diretorio persistente do OpenHands
      ansible.builtin.file:
        path: "{{ openhands_state_dir }}"
        state: directory
        owner: "10001"
        group: "10001"
        mode: "0777"

    - name: Instalar suporte a ACL
      ansible.builtin.apt:
        name: acl
        state: present

    - name: Garantir diretorio de projetos
      ansible.builtin.file:
        path: "{{ engos_projects_root }}"
        state: directory
        owner: "{{ engos_user }}"
        group: "{{ engos_group }}"
        mode: "0775"

    - name: Permitir acesso do OpenHands aos projetos
      ansible.builtin.command:
        cmd: setfacl -R -m u:10001:rwX,u:{{ engos_user }}:rwX {{ engos_projects_root }}
      changed_when: false

    - name: Configurar ACL padrao para novos diretorios e arquivos
      ansible.builtin.shell: find {{ engos_projects_root }} -type d -exec setfacl -m d:u:10001:rwX,d:u:{{ engos_user }}:rwX {} +
      changed_when: false
