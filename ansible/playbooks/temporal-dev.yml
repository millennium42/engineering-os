---
- name: Configure Temporal Development Service
  hosts: engos
  become: true

  tasks:
    - name: Criar diretorio persistente do Temporal
      ansible.builtin.file:
        path: "{{ temporal_data_dir }}"
        state: directory
        owner: "{{ engos_user }}"
        group: "{{ engos_group }}"
        mode: "0750"

    - name: Criar servico systemd do Temporal
      ansible.builtin.copy:
        dest: /etc/systemd/system/temporal-dev.service
        mode: "0644"
        content: |
          [Unit]
          Description=Engineering OS Temporal Development Server
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User={{ engos_user }}
          Group={{ engos_group }}
          ExecStart=/usr/local/bin/temporal server start-dev --db-filename {{ temporal_data_dir }}/temporal.db --ip 0.0.0.0 --port {{ temporal_port }} --ui-port {{ temporal_ui_port }}
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Recarregar systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Ativar e iniciar Temporal
      ansible.builtin.systemd:
        name: temporal-dev
        enabled: true
        state: started
